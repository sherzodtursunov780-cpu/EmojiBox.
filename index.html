<script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    



<div id="floatingEmojis"></div>
<div id="fx-container"></div>

<section id="hero" class="active min-h-screen flex-col items-center justify-center text-center p-6">
    <div class="glass p-16 rounded-[50px] max-w-xl w-full">
        <h1 class="text-7xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">Wisdom Box</h1>
        <button onclick="navigateTo('main-menu')" class="group relative px-12 py-4 bg-white text-black rounded-2xl font-black text-xl transition-all hover:scale-105 active:scale-95">ENTER THE COUNCIL</button>
    </div>
</section>

<section id="main-menu" class="min-h-screen p-8 md:p-16 flex-col">
    <header class="mb-16">
        <h2 class="text-4xl font-black mb-2 tracking-tight">THE COUNCIL</h2>
        <p class="text-gray-500">Choose an object to explore its wisdom.</p>
    </header>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-8" id="items-grid"></div>
</section>

<section id="detail-view" class="min-h-screen p-6 flex-col items-center justify-center">
    <div id="detail-container" class="glass p-10 md:p-16 rounded-[60px] max-w-3xl w-full relative text-center transition-all duration-700">
        <button onclick="navigateTo('main-menu')" class="back-btn">← BACK</button>
        
        <span id="d-emoji"></span>
        <h2 id="d-title" class="text-5xl font-black mb-4 tracking-tighter"></h2>
        <p id="d-meaning" class="font-bold tracking-[0.3em] text-sm uppercase mb-10"></p>
        <div id="info-mode">
            <div class="bg-white/5 p-8 rounded-3xl text-left border border-white/5 mb-10">
                <p id="d-proverb" class="text-xl text-gray-200 leading-relaxed italic font-light"></p>
            </div>
            <button id="start-test-btn" class="w-full py-6 rounded-3xl bg-indigo-600 font-black text-xl hover:bg-indigo-500 transition shadow-2xl shadow-indigo-500/40">TAKE THE TEST</button>
        </div>
        <div id="test-mode" class="inner-hidden flex-col">
            <h3 id="t-question" class="text-2xl mb-10 font-bold"></h3>
            <div id="t-options" class="grid gap-4"></div>
            <div id="t-feedback" class="mt-10 inner-hidden text-left p-8 rounded-3xl bg-white/5 border border-white/10">
                <p id="t-reason" class="text-gray-400 italic"></p>
            </div>
        </div>
    </div>
</section>
